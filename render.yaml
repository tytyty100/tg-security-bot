services:
  - type: web
    name: tg-security-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER
        value: ME_LOVE_A_CATS
      - key: ADMIN_ID
        value: "0"
      - key: BOT_PRIMARY
        value: render
